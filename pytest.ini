[pytest]
asyncio_mode = auto
testpaths = tests/unit tests/api
norecursedirs = .venv venv azure_fn
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Fast unit tests (no network, no browser)
    integration: Integration tests with mocks/fakeredis
    slow: Slow tests (browser mocks, optional CI)
    live: Live URL tests (opt-in, RUN_LIVE_TESTS=1)
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
